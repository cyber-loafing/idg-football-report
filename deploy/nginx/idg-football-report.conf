location = /idg-football-report {
    return 302 /idg-football-report/ui/;
}

location = /idg-football-report/ui {
    return 302 /idg-football-report/ui/;
}

location = /idg-football-report/ui/ {
    rewrite ^ /idg-football-report/ui/index.html last;
}

location /idg-football-report/ui/assets/ {
    alias /home/zjuidg/idg-football-report/frontend/dist/assets/;
    access_log off;
    expires 7d;
}

location /idg-football-report/ui/ {
    alias /home/zjuidg/idg-football-report/frontend/dist/;
    try_files $uri /idg-football-report/ui/index.html;
}

location = /idg-football-report/admin/perturbation {
    rewrite ^ /idg-football-report/_perturbation.html last;
}

location = /idg-football-report/_perturbation.html {
    internal;
    alias /home/zjuidg/idg-football-report/frontend/dist/perturbation.html;
}

location /idg-football-report/api/events {
    proxy_pass http://127.0.0.1:8000/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
}

location /idg-football-report/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /idg-football-report/bsApi/ {
    proxy_pass http://127.0.0.1:8000/bsApi/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /idg-football-report/zx/ {
    proxy_pass http://127.0.0.1:8000/zx/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
